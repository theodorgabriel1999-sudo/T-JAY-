name: macOS build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Validate component manifest
        run: plutil -lint -s -r Resources/components.json || python3 -m json.tool Resources/components.json >/dev/null
      - name: Build
        run: swift build -c release
