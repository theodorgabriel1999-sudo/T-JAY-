name: macOS build validation
on:
  push:
    branches: [main, reliability-1.0.1, reliability-1.0.2]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: swift --version
      - name: Validate component manifest
        run: python3 -m json.tool Resources/components.json >/dev/null
      - name: Build release executable
        run: swift build -c release
