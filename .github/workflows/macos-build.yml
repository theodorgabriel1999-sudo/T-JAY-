name: macOS build validation
on:
  push:
    branches: [main, reliability-1.0.2, ai-marketplace-v1]
  pull_request:
    branches: [main, reliability-1.0.2]
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: swift --version
      - name: Validate component manifest
        run: python3 -m json.tool Resources/components.json >/dev/null
      - name: Validate AI project catalogue
        run: python3 -m json.tool Resources/ai-project-catalog.json >/dev/null
      - name: Build and assemble macOS app
        run: bash scripts/build-app.sh
